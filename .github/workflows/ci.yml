name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # A couple of test scripts print non-ASCII characters (em dashes, etc.);
      # force UTF-8 so Windows runners on the default locale codepage don't
      # crash with a UnicodeEncodeError instead of an honest test failure.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install smoke_covenant (editable) + pytest
        run: python -m pip install -e . pytest

      - name: Preflight doctor (verifies the install is sane)
        shell: bash
        run: python doctor.py

      # smoke_covenant's own test suite is nine top-level test_*.py scripts.
      # Each is still independently runnable as a plain script
      # (`python test_X.py`, exit 0 on pass -- see "Run standalone script
      # mode" below), AND every one of them is also pytest-collectable via a
      # `test_main()` entry point that calls the same `main()`. No
      # conftest.py is needed; each script does its own sys.path wiring.
      #
      # Four of the nine need only this package's one dependency
      # (cryptography) and always run for real in CI:
      #
      #   test_standalone.py, test_toctou.py, test_anchor.py, test_c2pa.py
      #
      # The other five SKIP cleanly (not fail, not crash collection) on this
      # runner, because none of the following exist here:
      #   - test_comfy_adapter.py, test_comfy_node.py, test_large_asset.py,
      #     test_embedding_gap.py -- all need a real ComfyUI checkout
      #     (`_paths.find_comfyui_root()` returns None here, and the guard at
      #     the top of each file turns that into a module-level
      #     `pytest.skip()` instead of letting `resolve_comfyui_root()`'s
      #     SystemExit crash collection -- see _paths.py's `skip_or_die`).
      #     test_embedding_gap.py additionally guards its own torch +
      #     safetensors imports the same way; this repo deliberately does
      #     not pin either (ComfyUI supplies its own CUDA-matched torch).
      #   - test_vendor_conformance.py needs the private smoke-suite
      #     monorepo (`smoke_trust`) and SKIPs the same way without it.
      #
      # So `pytest -q` on this runner collects 9 files, runs 4 for real, and
      # reports 5 skips with the reason why -- not 5 passes, which would be
      # dishonest about what this CI actually verifies. See QUICKSTART.md
      # and comfy_node/README.md for exercising the ComfyUI-dependent paths
      # locally, against a real ComfyUI install (set COMFYUI_ROOT and/or
      # SMOKE_COVENANT_SUITE to have pytest run them for real too).
      - name: Run tests (pytest)
        shell: bash
        run: python -m pytest -q

      # Belt-and-suspenders: prove the plain "run it as a script" mode
      # (this repo's original, still-documented way to run these files, and
      # still how a reader with no pytest installed would use them) keeps
      # working too, not just the pytest wrapper above.
      - name: Run standalone script mode (test_standalone.py)
        shell: bash
        run: python test_standalone.py
